name: Test learning examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
        include:
          - os: ubuntu-latest
            node: 22
            npm: 12.2.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Use publishing npm version
        if: matrix.npm
        run: npm install -g npm@${{ matrix.npm }}
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          VERIFY_PACKED_PROJECT: 'true'
      - run: npm install --ignore-scripts
        working-directory: template
      - run: git diff --exit-code -- template/package.json
      - run: npm run test:examples
      - run: npm run lint --prefix template
