name: Test learning examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          VERIFY_PACKED_PROJECT: 'true'
      - run: npm install --prefix template --ignore-scripts
      - run: npm run test:examples
      - run: npm run lint --prefix template
